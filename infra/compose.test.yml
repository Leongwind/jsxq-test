services:
  analyzer:
    environment:
      LLM_BASE_URL: http://llm-stub:8001
      LLM_API_KEY: ci-test-key-not-a-secret
      LLM_MODEL: deterministic-test-stub
      LLM_MODE: test
    depends_on:
      llm-stub:
        condition: service_healthy
  llm-stub:
    image: ghcr.io/leongwind/jsxq-test-analyzer:${IMAGE_TAG:-local}
    command: ["uvicorn", "tests.llm_stub:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
