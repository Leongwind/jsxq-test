name: Verify and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerlens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, bff]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f services/jobs/pom.xml verify
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/analyzer/requirements.lock
            services/analyzer/requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
  integration:
    needs: [node, java, python]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build and start deterministic full chain
        run: |
          scripts/compose.sh -f compose.yml -f infra/compose.test.yml build
          scripts/compose.sh -f compose.yml -f infra/compose.test.yml up -d --no-build --wait
      - run: python3 scripts/smoke.py --analyze
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser acceptance
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npm run e2e
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - name: Container logs on failure (test data only)
        if: failure()
        run: scripts/compose.sh -f compose.yml -f infra/compose.test.yml logs --no-color --tail=100
      - name: Stop test environment
        if: always()
        run: scripts/compose.sh -f compose.yml -f infra/compose.test.yml down
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - service: web
            context: apps/web
          - service: bff
            context: apps/bff
          - service: jobs
            context: services/jobs
          - service: analyzer
            context: services/analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/leongwind/jsxq-test-${{ matrix.service }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Leongwind/jsxq-test
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
